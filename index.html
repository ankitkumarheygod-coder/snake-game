<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Snake Game</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <div class="title">🐍 Snake</div>
            <div class="score-board">
                <div class="score-box">SCORE: <span id="currentScore">0</span></div>
                <div class="score-box">BEST: <span id="bestScore">0</span></div>
            </div>
            <button id="pauseBtn" class="pause-btn">⏸️</button>
        </header>

        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Pause Overlay -->
            <div id="pauseOverlay" class="overlay pause-overlay">
                <h2>PAUSED</h2>
                <p>Tap Resume to continue</p>
                <button id="resumeBtn" class="action-btn">RESUME</button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameOverOverlay" class="overlay game-over-overlay">
                <h2>GAME OVER</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <p>Best: <span id="finalBestScore">0</span></p>
                <button id="restartBtn" class="action-btn">RESTART</button>
            </div>
        </div>
        <p class="instruction">Swipe on board to play</p>
    </div>

    <!-- ES Module Loading -->
    <script type="module" src="./js/game.js"></script>
</body>
</html>
