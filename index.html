<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Snake Game Mobile</title>
    <meta name="description" content="A mobile-first, high-performance Snake Game with smooth touch swipe controls and wrap-around boundaries." />
    <meta property="og:title" content="Snake Game Mobile" />
    <meta property="og:description" content="A mobile-first, high-performance Snake Game with smooth touch swipe controls and wrap-around boundaries." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Top Header -->
      <header class="game-header">
        <div class="brand">
          <span class="brand-icon" role="img" aria-label="Snake">🐍</span>
          <span class="brand-title">Snake</span>
        </div>

        <div class="header-stats">
          <div class="stat-pill">
            <span class="stat-label">SCORE</span>
            <span id="current-score" class="stat-value score-highlight">0</span>
          </div>

          <div class="stat-pill">
            <span class="stat-label">BEST</span>
            <span id="high-score" class="stat-value">0</span>
          </div>

          <button id="pause-toggle-btn" class="pause-btn" aria-label="Pause Game" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
        </div>
      </header>

      <!-- Center Game Board Container (Swipe Area) -->
      <main class="board-wrapper">
        <div class="canvas-container">
          <canvas id="game-board"></canvas>

          <!-- Game Over Modal Overlay -->
          <div id="game-over-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
            <h2 id="game-over-title" class="overlay-title gameover">GAME OVER</h2>
            <div class="overlay-stats">
              <div class="overlay-stat-row">
                <span class="label">Score:</span>
                <span id="final-score" class="val">0</span>
              </div>
              <div class="overlay-stat-row">
                <span class="label">Best:</span>
                <span id="best-score" class="val">0</span>
              </div>
            </div>
            <button id="restart-btn" class="primary-btn" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              <span>RESTART</span>
            </button>
          </div>

          <!-- Pause Overlay -->
          <div id="pause-overlay" class="overlay" role="dialog" aria-modal="true">
            <h2 class="overlay-title paused">PAUSED</h2>
            <p class="hint-text">Swipe to resume or tap below</p>
            <button id="resume-btn" class="primary-btn" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>RESUME</span>
            </button>
          </div>
        </div>
      </main>

      <!-- Simple bottom swipe hint (No buttons, no D-pad) -->
      <footer class="game-footer">
        <p class="swipe-hint">Swipe board to turn • Space to pause</p>
      </footer>
    </div>

    <!-- Modular Game Script -->
    <script type="module" src="/js/game.js"></script>
  </body>
</html>
